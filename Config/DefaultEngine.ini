[/Script/TerrainCore.TerrainSettings]
; ARCHITECTURE.md 4.1 and 10. Swapping the terrain backend is this line plus a new module
; implementing ITerrainBackend: no gameplay code, no asset and no save-format change. The
; name is a MODULE name; UTerrainService loads it and then asks FTerrainBackendRegistry for
; its factory, so TerrainCore never links against it.
BackendModule=TerrainBackendVPLegacy
; Coordinate policy is game-owned (8.1). These are what the server quantises against and what
; the adapter is required to conform its AVoxelWorld actor to. Changing either after a world
; has been dug is a resample migration (FM-9), not a tuning change.
; 50 cm voxels and a 1024-voxel world are the T-101A test terrain: 512 m across, and small
; enough that a 200 cm dig brush clears about four voxels and reads as a hole.
VoxelSizeCm=50.000000
WorldSizeVoxels=1024
TerrainOriginWorld=(X=0.000000,Y=0.000000,Z=0.000000)
Seed=0
; The world's shape is FTerrainWorldField (T-108, ARCHITECTURE 4.6). Version 0 was the
; VoxelFlatGenerator plane the project ran on from T-101A to CP-012; version 1 is the
; generated hill, strata and ore body. 4.2 and K3 record this in every snapshot header, so
; BUMP IT whenever the field's shape changes or a chunk saved under the old world is silently
; reinterpreted by the new one.
GeneratorVersion=1
; Admission limits. MaxVoxelsPerOp is 7.1's 65,536 written voxels; over that an operation
; must be split into sub-ops sharing a TransactionId, which is build step 3 work under DEF-7,
; so until then the service rejects rather than splits.
MaxEditRadiusCm=1000.000000
MaxVoxelsPerOp=65536
DefaultInterestRadiusCm=10000.000000
